[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arche-core"
# Single-sourced from src/arche/_version.py so the wheel metadata and
# ``arche.__version__`` can never disagree. They did once: this file said
# 0.2.0a3 while the package reported 0.3.0a1, which would have published
# the 0.3 line under the 0.2 version number.
dynamic = ["version"]
description = "An open-source engine for deciding when messy records of people, places, organisations, and products refer to the same real-world entity, with evidence, not just similarity scores or identifiers: decide which records describe the same person, place, organisation or product, keep the evidence, abstain when the evidence is thin, and sign the decision so a stranger can re-check it. Reads documents as well as records. Runs offline on CPU; composes with Splink, Presidio and GLiNER."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Dennis Irorere", email = "connect@unpatterned.org"}
]
# Ordered by what the package is, then what it works on, then where its
# calibration is deepest. `MCP` was removed: there is no MCP server in this
# package and listing it made the index advertise software that does not exist.
keywords = [
    # what it is
    "entity-resolution", "record-linkage", "identity-resolution",
    "data-matching", "deduplication", "fuzzy-matching", "data-fusion",
    "master-data-management", "golden-record", "data-quality", "data-cleaning",
    # what it works on
    "unstructured-data", "document-intelligence", "pdf-extraction",
    "address-matching", "geocoding", "product-matching", "company-matching",
    "supply-chain", "knowledge-graph", "multilingual",
    # what makes a decision defensible
    "attestation", "verifiable-credentials", "provenance", "reproducibility",
    "audit", "explainable",
    # governed data
    "PII", "PII-detection", "PII-redaction", "data-protection", "compliance",
    "GDPR", "HIPAA", "NDPA", "POPIA", "Kenya-DPA", "Ghana-DPA",
    # where the calibration is deepest, not the limit of where it runs
    "African-names", "Africa", "Nigeria", "Kenya", "South-Africa", "Ghana",
    "arche", "arche-core",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Base install: under 100MB, no mandatory ML or DPI dependencies.
# Heavy capabilities ship as opt-in extras below per PRD §1 and BP §7.
dependencies = [
    "rapidfuzz>=3.0",
    "jellyfish>=1.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "h3>=4.0",
    # libphonenumber Python port (~5MB, pure-Python). Required for PRD
    # FR-DETECT-9 — country-aware phone number detection and E.164
    # normalization across all launch jurisdictions plus the 30+ African
    # countries supported by arche.detect._africa.phones.
    "phonenumbers>=8.13",
    # YAML parser for policy/statutes/*.yaml — machine-readable statute
    # files per PRD §6.4. ~200KB, standard across the ecosystem.
    "pyyaml>=6.0",
    # Cryptography stack for arche.sign — Ed25519, did:key, JWS envelope,
    # and (Stage 2) hybrid PQC signatures. Apache-2.0 + BSD dual-licensed,
    # ~3MB pure-Python wheels on all platforms. Required for the
    # sign-share-extract identity workflow (PRD §6.5 in proposal).
    "cryptography>=43.0",
    # HTTP client for arche.ingest.from_url (v0.2.0a2). Pure-Python ~500KB,
    # supports streaming + redirect-following + tight timeout control,
    # which are all required for the SSRF-guarded web fetch helper.
    "httpx>=0.27",
]

[project.optional-dependencies]
# --- Document ingestion (carried from v0.1, still optional) ----------------
pdf = ["pymupdf>=1.24"]
docx = ["python-docx>=1.1"]
# docling-backed structured parsing (arche.doc). The base wheel never pulls it;
# arche.doc raises a helpful error pointing here when docling is absent.
doc = ["docling>=2.0"]
# Scanned-document OCR: RapidOCR is docling's lightweight pure-ONNX backend
# (no torch, no system tesseract) — in keeping with the CPU-only base ethos.
doc-ocr = ["arche-core[doc]", "rapidocr-onnxruntime>=1.3"]

# Parquet review packs. `arche.review.read_pack` reads CSV and JSONL with the
# standard library; parquet is the one format that needs a dependency, so it is
# the one format behind an extra.
parquet = ["pyarrow>=14"]

# --- v0.2 detector backends (PRD §4) ---------------------------------------
# GLiNER2-PII via ONNX runtime (~250MB). Multilingual soft-PII detection.
detect = ["gliner>=0.2.8", "onnxruntime>=1.18"]
# GLiNER 2.5 (Fastino, Apache-2.0). The `[local]` marker is load-bearing:
# bare `gliner2` installs an API client that posts text to a hosted service,
# so declaring it without `[local]` would ship a code path that sends customer
# text off the machine. `[local]` is the on-device inference stack.
detect2 = ["gliner2[local]>=2.0"]
# Microsoft Presidio recognizer plugin (~lightweight).
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# Splink + DuckDB for billion-row entity resolution (~200MB). Stage 2+.
resolve = ["splink>=4.0", "duckdb>=1.0"]

# --- Geo / places resolution (H3 blocking is BASE; these add polygon joins ---
# (shapely, for annotate_admin point-in-polygon) and the Overture Places pull
# (duckdb). The lightweight base wheel never requires them.
geo = ["shapely>=2.0", "duckdb>=1.0"]

# --- Per-country detector bundles (PRD §6.1) -------------------------------
# Currently empty - all African detectors ship in the base install.
# These bundles exist as forward-compatible namespaces so a Nigerian fintech
# can `pip install arche-core[ng]` and pin to NG-specific changes without
# pulling KE/ZA/GH validators it doesn't need (Stage 2+ work).
ng = []
ke = []
za = []
gh = []
africa = []

# --- LLM integrations ------------------------------------------------------
llm = ["openai>=1.0", "anthropic>=0.30"]
litellm = ["litellm>=1.40"]

# --- Deprecated v0.1 extras (kept for one minor version) -------------------
# Removed in v0.3. Update your install commands.
gliner = ["arche-core[detect]"]  # v0.1 name; use [detect]
pii = ["arche-core[presidio]"]   # v0.1 name; use [presidio]
splink = ["arche-core[resolve]"] # v0.1 name; use [resolve]

# --- Convenience -----------------------------------------------------------
all = ["arche-core[pdf,docx,detect,presidio,resolve,llm]"]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://unpatterned.org"
Repository = "https://github.com/unpatterned-labs/arche"
# docs.unpatterned.org does not resolve (DNS times out); the docs are served
# from GitHub Pages. Point PyPI at the site that exists.
Documentation = "https://unpatterned-labs.github.io/arche/"
Changelog = "https://github.com/unpatterned-labs/arche/blob/main/packages/arche-core/CHANGELOG.md"
Issues = "https://github.com/unpatterned-labs/arche/issues"

# The v0.2-aware CLI. One subcommand for now: ``arche compare`` — the
# 30-seconds-to-artifact front door (masked-by-default HTML report +
# decisions.json sidecar; ``--demo`` needs no data). The legacy v0.1 CLI
# (``arche resolve/extract/review``) stays retired.
[project.scripts]
arche = "arche.cli:main"

[tool.hatch.version]
path = "src/arche/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arche"]
