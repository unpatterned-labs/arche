  # ── UK, formal ──────────────────────────────────────────────────────────
  - id: gb-001
    register: formal
    jurisdiction: GB
    text: "Can you come pick up this package from 123 Maple Street, London and send it to 3 Sherborne Place, Birmingham?"
    places:
      - {role: origin, text: "123 Maple Street, London", cue: "from"}
      - {role: destination, text: "3 Sherborne Place, Birmingham", cue: "to"}
    note: the ticket's own example.
  - id: gb-002
    register: formal
    jurisdiction: GB
    text: "Courier collects from SE1 7EH at 09:00 and drops at EC2A 4DP before noon."
    places:
      - {role: origin, text: "SE1 7EH", cue: "from"}
      - {role: destination, text: "EC2A 4DP", cue: "drops at"}
  - id: gb-003
    register: formal
    jurisdiction: GB
    text: "The van runs between Manchester and Leeds every Tuesday."
    places:
      - {role: origin, text: "Manchester", cue: "runs between"}
      - {role: destination, text: "Leeds", cue: "and"}
    note: pair rule between_route.
  - id: gb-004
    register: formal
    jurisdiction: GB
    text: "Our office is between Old Street and Moorgate."
    places:
      - {role: location, text: "Old Street", cue: "between"}
      - {role: location, text: "Moorgate", cue: "and"}
    note: bare `between` gives two locations, never a direction.
  - id: gb-005
    register: formal
    jurisdiction: GB
    text: "Deliver the crate to 44 Holloway Road, London N7 8JG."
    places:
      - {role: destination, text: "44 Holloway Road, London N7 8JG", cue: "to"}
  - id: gb-006
    register: formal
    jurisdiction: GB
    text: "She is based at 12 Queen Anne Terrace, Cambridge these days."
    places:
      - {role: location, text: "12 Queen Anne Terrace, Cambridge", cue: "based at"}
  - id: gb-007
    register: formal
    jurisdiction: GB
    text: "Shipment departs from 8 Dock Road, Liverpool via M62."
    places:
      - {role: origin, text: "8 Dock Road, Liverpool", cue: "from"}
      - {role: via, text: "M62", cue: "via"}
    note: the motorway is a legitimate waypoint (MOVELINK midPoint).
  - id: gb-008
    register: formal
    jurisdiction: GB
    text: "Return the keys to 2 Abbey Gardens, York when done."
    places:
      - {role: destination, text: "2 Abbey Gardens, York", cue: "to"}
  - id: gb-009
    register: formal
    jurisdiction: GB
    text: "I am at SE1 7EH right now, meet me there."
    places:
