  - id: gb-010
    register: formal
    jurisdiction: GB
    text: "The route between 5 Mill Lane, Oxford and 9 Bridge Street, Reading takes an hour."
    places:
      - {role: origin, text: "5 Mill Lane, Oxford", cue: "route between"}
      - {role: destination, text: "9 Bridge Street, Reading", cue: "and"}

