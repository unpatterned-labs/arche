#
# place_roles_v1 — the gold sentence set for spatial role labeling.
#
# 54 labelled sentences: UK + Nigerian address forms, formal and informal
# registers, Pidgin/Hausa/Swahili cues, and adversarial items whose gold role
# is `unknown` (a system asserting a role there is over-guessing — the failure
# mode this eval exists to price). Fragments are substrings of `text`; the
# loader resolves them to spans and rejects absent or ambiguous fragments.
#
# Grade ANY extractor against this set with arche.addr.grade_places — the set
# ships in the wheel precisely so a stranger can run the eval offline.
#
# v1 is a PROBE (50 items), not a benchmark: per-role confidence intervals at
# this size are wide. The citable version (dual-annotated, reported kappa)
# is tracked as v2.

pack: arche.place_roles.gold
version: v1
license: CC-BY-4.0
sentences:
  # ── Nigerian, formal ─────────────────────────────────────────────────────
  - id: ng-001
    register: formal
    jurisdiction: NG
    text: "Pick up the parcel from 7B Allen Avenue, Ikeja, Lagos and deliver to 12 Adeola Odeku Street, Victoria Island."
