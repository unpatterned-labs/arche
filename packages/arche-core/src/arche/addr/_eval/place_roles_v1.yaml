  # ── Person-name traps ───────────────────────────────────────────────────
  - id: trap-001
    register: informal
    jurisdiction: NG
    text: "Collect the documents from Alhaji Musa and take them to 14 Awolowo Road, Ikoyi."
    places:
      - {role: destination, text: "14 Awolowo Road, Ikoyi", cue: "take them to"}
    note: "'from Alhaji Musa' is a person — the title stoplist vetoes it."
  - id: trap-002
    register: formal
    jurisdiction: GB
    text: "meet Grace Street at the cafe on Milton Road, Cambridge"
    places:
      - {role: location, text: "Milton Road, Cambridge", cue: "on"}
    note: "'Grace Street' is a person; the weak-span gate suppresses it."
  - id: trap-003
    register: formal
    jurisdiction: GB
    text: "Hand the report to Dr Fleet and copy the team in London."
    places:
      - {role: location, text: "London", cue: "in"}
    note: "'to Dr Fleet' is a person."

  # ── Adversarial: gold role is unknown ───────────────────────────────────
  - id: amb-001
    register: formal
    jurisdiction: NG
    text: "The consignment was picked up at and delivered to 7B Allen Avenue, Ikeja."
    places:
      - {role: unknown, text: "7B Allen Avenue, Ikeja", cue: "delivered to"}
    note: two directional cues at equal priority — abstain, never pick one.
  - id: amb-002
    register: formal
    jurisdiction: NG
    text: "Don't deliver to 31 Ribadu Road, Kano anymore, that address is closed."
    places:
      - {role: unknown, text: "31 Ribadu Road, Kano", cue: "deliver to"}
    note: negation voids the role the cue names.
  - id: amb-003
    register: formal
    jurisdiction: GB
    text: "Regarding 17 Fleet Lane, London, we have three open questions."
    places:
      - {role: unknown, text: "17 Fleet Lane, London", cue: null}
    note: a place mention with no spatial-role cue at all.
  - id: amb-004
    register: formal
    jurisdiction: NG
    text: "The invoice from our Lagos office lists the registered address."
    places:
      - {role: unknown, text: "Lagos", cue: null}
    note: >
      Attributive mention — a movement-shaped cue ("from") with no movement.
      The known blind spot of cue-based labeling; a system asserting origin
      here is over-guessing.
  - id: amb-005
    register: formal
    jurisdiction: GB
    text: "Never send anything to 5 Cannon Row, Westminster without approval."
    places:
      - {role: unknown, text: "5 Cannon Row, Westminster", cue: "send"}
    note: negated instruction; committing destination here is a role error.
  - id: amb-006
    register: informal
    jurisdiction: NG
    text: "That 22 Bode Thomas Street, Surulere matter never resolve."
    places:
      - {role: unknown, text: "22 Bode Thomas Street, Surulere", cue: null}
    note: topic mention, no spatial role.

  # ── Negatives: no places at all ─────────────────────────────────────────
  - id: neg-001
    register: formal
    jurisdiction: XX
    text: "Please send the invoice to me by end of day."
    places: []
  - id: neg-002
    register: informal
    jurisdiction: XX
    text: "take vitamin B2 daily and drink plenty of water"
    places: []
    note: the partial-postcode trap — B2 is a vitamin, not Birmingham.
  - id: neg-003
    register: formal
    jurisdiction: XX
    text: "The board approved the budget after a long discussion."
    places: []
  - id: neg-004
    register: formal
    jurisdiction: XX
    text: "From what I heard, the deal is off."
    places: []
    note: "'From' with no place after it."

  # ── Mixed / boundary stress ─────────────────────────────────────────────
  - id: mix-001
    register: formal
    jurisdiction: NG
    text: "Route the driver from 4 Ogunu Road, Warri through Benin City to 10 Airport Road, Abuja."
    places:
      - {role: origin, text: "4 Ogunu Road, Warri", cue: "from"}
      - {role: via, text: "Benin City", cue: "through"}
      - {role: destination, text: "10 Airport Road, Abuja", cue: "to"}
  - id: mix-002
    register: formal
    jurisdiction: GB
    text: "Pick up at 6 Camden Passage, London, then wait at the depot."
    places:
      - {role: origin, text: "6 Camden Passage, London", cue: "Pick up at"}
    note: "'the depot' is not a resolvable place span in v1."
  - id: mix-003
    register: formal
    jurisdiction: NG
    text: "Send it to 2 Awolowo Avenue, Ibadan and copy the Lagos team."
    places:
      - {role: destination, text: "2 Awolowo Avenue, Ibadan", cue: "to"}
      - {role: unknown, text: "Lagos", cue: null}
    note: the second mention is attributive ("the Lagos team"), not a role.
  - id: mix-004
    register: informal
    jurisdiction: NG
    text: "From Yaba you fit reach Ikorodu by ferry."
    places:
      - {role: origin, text: "Yaba", cue: "From"}
      - {role: destination, text: "Ikorodu", cue: "reach"}
    note: "'you fit reach' — reach as a Pidgin destination verb is v2 vocabulary; labeling only Yaba origin is also acceptable, but gold records the truth."
  - id: mix-005
    register: formal
    jurisdiction: GB
    text: "Stopping at 3 Station Parade, Harrogate before the final leg."
    places:
      - {role: via, text: "3 Station Parade, Harrogate", cue: "Stopping at"}
