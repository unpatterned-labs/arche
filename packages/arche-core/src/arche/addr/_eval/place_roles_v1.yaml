  # ── Cross-border / city-level ───────────────────────────────────────────
  - id: xx-001
    register: formal
    jurisdiction: KE
    text: "She moved from Nairobi to Kampala last year."
    places:
      - {role: origin, text: "Nairobi", cue: "from"}
      - {role: destination, text: "Kampala", cue: "to"}
  - id: xx-002
    register: formal
    jurisdiction: ZA
    text: "Ship to P.O. Box 1234, Sandton, Johannesburg, 2196."
    places:
      - {role: destination, text: "P.O. Box 1234, Sandton, Johannesburg, 2196", cue: "to"}
  - id: xx-003
    register: formal
    jurisdiction: GH
    text: "The container transfers between Tema and Kumasi twice a week."
    places:
