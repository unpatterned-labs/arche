#
# document_address_roles_v1 — gold set for document address roles.
#
# EVERY DOCUMENT HERE IS SYNTHETIC. Company names carry "(synthetic)" or are
# invented; company numbers, VAT numbers and bank details are placeholders.
# Street and town names are real so the address parser meets real shapes, but
# no address is asserted to belong to any real business.
#
# Fragments are substrings of `text`; the loader resolves them to spans and
# rejects absent or ambiguous fragments. Items whose gold role is `unknown`
# are adversarial: no cue, a negated cue, or two cues that disagree. A system
# that commits a role there is over-guessing.
#
# Grade any extractor with arche.addr.grade_document_addresses.
#
# v1 is a PROBE (20 documents), not a benchmark.

pack: arche.document_address_roles.gold
version: v1
license: CC-BY-4.0
documents:
