# type_tokens.yaml — canonical entity type-token vocabularies.
#
# What it is: for a domain (health_facility, organization, ...), a set of
# CANONICAL type tokens, each with the SYNONYMS that mean the same thing and a
# human-readable DESCRIPTION. Loaded by resolve.load_type_vocab(domain) into a
# flat {synonym: canonical} map that feeds resolve.normalize_type_token(), which
# strips the type token so a matcher compares the *distinctive* proper name
# ("Karfi", not the shared "Primary Health Centre") and the type separately.
#
# Why it lives here: type vocabularies are African-context calibration data —
# the same kind of curated asset as the name lexicon and address tokens. Adding
# a domain or a synonym is a data edit, not a code change. Build on it.
#
# Contributor notes:
#   - Synonyms are matched case-insensitively, diacritics-folded, on word
#     boundaries; the longest matching synonym wins.
#   - Keep synonyms specific enough to avoid collisions (prefer "health centre"
#     over a bare "centre").

health_facility:
  # `group` (20 Nov 2026): which types are tiers of one kind of facility. The
  # `health_facility` pack refutes only ACROSS groups -- a clinic is never the
  # hospital of the same town -- because Nigerian lists call one facility a
  # PHC, a health clinic or a health centre interchangeably. The
  # `health_facility_za` pack refutes any difference: South Africa names its
  # tiers officially (clinic, CHC, satellite clinic, district hospital).
  PHC:
    group: primary_care
    description: Primary health centre / primary health care facility (the base tier of Nigerian PHC).
    synonyms:
      - primary health centre
      - primary health center
      - primary health care centre
      - primary healthcare centre
      - comprehensive health centre
      - phc
      - health centre
      - health center
  DISPENSARY:
    group: primary_care
    description: Dispensary — small drug-dispensing / basic-care facility.
    synonyms:
      - dispensary
  HOSPITAL:
    group: hospital
    description: Hospital — general, teaching, specialist, cottage, or referral; and South Africa's tiers (district, regional, provincial tertiary, national central).
    synonyms:
      - general hospital
      - teaching hospital
      - specialist hospital
      - cottage hospital
      - referral hospital
      - district hospital
      - regional hospital
      - provincial tertiary hospital
      - tertiary hospital
      - national central hospital
      - central hospital
      - academic hospital
      - hospital
  MATERNITY:
    group: primary_care
    description: Maternity home / maternity centre.
    synonyms:
      - maternity home
      - maternity centre
      - maternity
  CLINIC:
    group: primary_care
    description: Clinic / medical centre (often private).
    synonyms:
      - health clinic
      - medical centre
      - medical center
      - clinic
  # South Africa (20 Nov 2026, from the WHO/KEMRI ZA list's own type column):
  # a community health centre is a tier of its own; a satellite clinic is a
  # clinic's outpost and is not the clinic it hangs off.
  CHC:
    group: primary_care
    description: Community health centre / community day centre (South Africa's tier above the clinic).
    synonyms:
      - community health centre
      - community health center
      - community day centre
      - community day center
      - chc
  SATELLITE_CLINIC:
    group: primary_care
    description: Satellite clinic — an outpost of a parent clinic, a facility of its own.
    synonyms:
      - satellite clinic
      - satelite clinic
  HEALTH_POST:
    group: primary_care
    description: Health post — the smallest outreach facility.
    synonyms:
      - health post
  # Specialty facilities. Added 18 Nov 2026 after `Impro Vision Eye Clinic`
  # matched `Dupsnl Vision Eye Clinic` (0.741): the shipped place table is built
  # mostly from primary-care names, so `eye` (0.61) and `vision` (0.93) look
  # distinctive there when they are what every eye clinic is called. They are
  # type words; the identifying name is what is left. `vision eye clinic` is in
  # because that is how such clinics are commonly written in the Nigerian lists
  # read so far, not because `vision` is a type on its own.
  EYE_CLINIC:
    group: specialty
    description: Eye clinic / eye hospital / optical clinic.
    synonyms:
      - vision eye clinic
      - eye clinic
      - eye hospital
      - eye centre
      - eye center
      - eye care centre
      - eye care center
      - optical clinic
  DENTAL_CLINIC:
    group: specialty
    description: Dental clinic / dental hospital.
    synonyms:
      - dental clinic
      - dental hospital
      - dental centre
      - dental center
  LABORATORY:
    group: specialty
    description: Medical or diagnostic laboratory / diagnostic centre.
    synonyms:
      - medical laboratory
      - diagnostic laboratory
      - diagnostic centre
      - diagnostic center
      - laboratory
  ORTHOPAEDIC_HOSPITAL:
    group: specialist_hospital
    description: Orthopaedic hospital.
    synonyms:
      - orthopaedic hospital
      - orthopedic hospital
  PSYCHIATRIC_HOSPITAL:
    group: specialist_hospital
    description: Psychiatric / neuropsychiatric hospital.
    synonyms:
      - neuropsychiatric hospital
      - psychiatric hospital
  PHARMACY:
    group: pharmacy
    description: Pharmacy / chemist / patent-medicine vendor.
    synonyms:
      - pharmacy
      - chemist
      - patent medicine

organization:
  # --- Legal forms ---------------------------------------------------------
  # `legal_form: true` marks an entry the `legal_form` comparator reads (see
  # legal_form_compat.yaml for how two forms relate). Each form is its own
  # entry because a form is a discriminator: `plc` was once a synonym of
  # `LTD`, so "Zenith Bank Plc" and "Zenith Bank Limited" were one name.
  # Stripping is unchanged — every entry is still removed before the name is
  # compared; the form is then compared on its own.
  #
  # `elf_code` (ISO 20275) is added only where the code is known for certain;
  # none is yet, so none is given. Do not guess one.
  LTD:
    description: Private company limited by shares (Anglophone).
    legal_form: true
    synonyms:
      - limited
      - ltd
  PLC:
    description: Public limited company (GB, NG and other Anglophone registries).
    legal_form: true
    synonyms:
      - public limited company
      - plc
  LLP:
    description: Limited liability partnership — a partnership, never a company.
    legal_form: true
    synonyms:
      - limited liability partnership
      - llp
  LP:
    description: Limited partnership.
    legal_form: true
    synonyms:
      - limited partnership
      - lp
  CIC:
    description: Community interest company (GB).
    legal_form: true
    synonyms:
      - community interest company
      - cic
  CIO:
    description: Charitable incorporated organisation (GB).
    legal_form: true
    synonyms:
      - charitable incorporated organisation
      - charitable incorporated organization
      - cio
  UNLIMITED:
    description: Unlimited company (GB).
    legal_form: true
    synonyms:
      - unlimited company
      - unlimited
  LTD_GTE:
    description: Company limited by guarantee (NG writes "Ltd/Gte").
    legal_form: true
    synonyms:
      - limited by guarantee
      - ltd by guarantee
      - ltd/gte
      - ltd gte
  INC_TRUSTEES:
    description: Incorporated trustees (NG, CAMA Part F) — a body of trustees, not a company.
    legal_form: true
    synonyms:
      - incorporated trustees
  SARL:
    description: Société à responsabilité limitée (Francophone West/Central Africa).
    legal_form: true
    synonyms:
      - sarl
  COOPERATIVE:
    description: Cooperative society (e.g. cocoa/farmer cooperatives).
    synonyms:
      - co-operative society
      - cooperative society
      - co-operative
      - cooperative
      - coop
  NGO:
    description: Non-governmental organisation.
    synonyms:
      - non-governmental organisation
      - ngo
  # --- Agricultural supply chains (cocoa, coffee, tea) -------------------
  # The aggregation node differs by commodity — society for cocoa, washing
  # station for coffee, factory or estate for tea — but the shape is the same:
  # a named site, operated by a legal entity, aggregating from many
  # smallholders. Stripping the form leaves the distinctive part ("Kuapa
  # Kokoo", not the shared "Farmers Cooperative Union Ltd").
  #
  # Stripping the form does NOT separate a site from its operator: "Nyeri Hill
  # Factory" and "Nyeri Hill Tea Factory Co Ltd" both reduce toward "Nyeri
  # Hill". Only a declared entity_class refutes that pair — see the `category`
  # comparator.
  UNION:
    description: Union of cooperatives or growers — a tier above the society, and never the same entity as its members.
    synonyms:
      - farmers co-operative union
      - farmers cooperative union
      - cooperative union
      - co-operative union
      - farmers union
      - farmers' union
      - growers union
      - union of cooperatives
  SACCO:
    description: Savings and credit cooperative (East Africa); frequently the payment vehicle for a growers' group rather than the grower itself.
    synonyms:
      - savings and credit cooperative
      - sacco
  BUYING_COMPANY:
    description: Licensed/produce buying company — the regulated intermediary that buys from farmers (Ghana cocoa).
    synonyms:
      - licensed buying company
      - produce buying company
      - buying company
      - lbc
  ESTATE:
    description: Estate or plantation — a large contiguous production holding, common in tea and coffee. A site, not its operating company.
    synonyms:
      - estate
      - plantation
      - tea estate
      - coffee estate
  FACTORY:
    description: Processing factory — the tea aggregation node (Kenya/KTDA smallholder factories). A site, not its operating company.
    synonyms:
      - tea factory
      - processing factory
      - factory
  WASHING_STATION:
    description: Coffee washing station / wet mill — where cherry is aggregated and a lot first acquires an identity.
    synonyms:
      - coffee washing station
      - washing station
      - wet mill
      - cws
  MILL:
    description: Dry mill or huller — later-stage coffee processing.
    synonyms:
      - dry mill
      - huller
      - mill
  ASSOCIATION:
    description: Growers' or producers' association, often unregistered.
    synonyms:
      - growers association
      - producers association
      - farmers association
      - association
  # Not a legal form: a business-name marker. Stripped for name comparison as
  # it always has been; the `legal_form` comparator reads its own marker list
  # (legal_form_compat.yaml `business_name_markers`) to tell a business name
  # from a company, so this entry carries no `legal_form` flag.
  ENTERPRISE:
    description: Enterprise / ventures / trading — the most common informal African business suffix, and frequently a sole trader (see the personal-data boundary).
    synonyms:
      - enterprises
      - enterprise
      - ventures
      - trading company
  # Further legal forms, so a European counterparty's own records normalise
  # on the same footing as the African ones they are being joined to.
  BV:
    description: Besloten vennootschap (Netherlands) — common for EU cocoa and coffee importers.
    legal_form: true
    synonyms:
      - besloten vennootschap
      - b.v.
      - bv
  GMBH:
    description: Gesellschaft mit beschränkter Haftung (Germany/Austria).
    legal_form: true
    synonyms:
      - gmbh
  PTY:
    description: Proprietary limited (South Africa, Australia).
    legal_form: true
    synonyms:
      - proprietary limited
      - pty ltd
      - pty
  SA_CORP:
    description: Société anonyme / sociedade anónima — Francophone and Lusophone public company.
    legal_form: true
    synonyms:
      - societe anonyme
      - société anonyme
      - sociedade anonima
