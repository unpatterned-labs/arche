# type_tokens.yaml — canonical entity type-token vocabularies.
#
# What it is: for a domain (health_facility, organization, ...), a set of
# CANONICAL type tokens, each with the SYNONYMS that mean the same thing and a
# human-readable DESCRIPTION. Loaded by resolve.load_type_vocab(domain) into a
# flat {synonym: canonical} map that feeds resolve.normalize_type_token(), which
# strips the type token so a matcher compares the *distinctive* proper name
# ("Karfi", not the shared "Primary Health Centre") and the type separately.
#
# Why it lives here: type vocabularies are African-context calibration data —
# the same kind of curated asset as the name lexicon and address tokens. Adding
# a domain or a synonym is a data edit, not a code change. Build on it.
#
# Contributor notes:
#   - Synonyms are matched case-insensitively, diacritics-folded, on word
#     boundaries; the longest matching synonym wins.
#   - Keep synonyms specific enough to avoid collisions (prefer "health centre"
#     over a bare "centre").

health_facility:
  PHC:
    description: Primary health centre / primary health care facility (the base tier of Nigerian PHC).
    synonyms:
      - primary health centre
      - primary health center
      - primary health care centre
      - primary healthcare centre
      - comprehensive health centre
      - phc
      - health centre
      - health center
  DISPENSARY:
    description: Dispensary — small drug-dispensing / basic-care facility.
    synonyms:
      - dispensary
  HOSPITAL:
    description: Hospital — general, teaching, specialist, cottage, or referral.
    synonyms:
      - general hospital
      - teaching hospital
      - specialist hospital
      - cottage hospital
      - referral hospital
      - hospital
  MATERNITY:
    description: Maternity home / maternity centre.
    synonyms:
      - maternity home
      - maternity centre
      - maternity
  CLINIC:
    description: Clinic / medical centre (often private).
    synonyms:
      - health clinic
      - medical centre
      - medical center
      - clinic
  HEALTH_POST:
    description: Health post — the smallest outreach facility.
    synonyms:
      - health post
  PHARMACY:
    description: Pharmacy / chemist / patent-medicine vendor.
    synonyms:
      - pharmacy
      - chemist
      - patent medicine

organization:
  LTD:
    description: Limited liability company (Anglophone).
    synonyms:
      - limited
      - ltd
      - plc
  SARL:
    description: Société à responsabilité limitée (Francophone West/Central Africa).
    synonyms:
      - sarl
  COOPERATIVE:
    description: Cooperative society (e.g. cocoa/farmer cooperatives).
    synonyms:
      - co-operative society
      - cooperative society
      - co-operative
      - cooperative
      - coop
  NGO:
    description: Non-governmental organisation.
    synonyms:
      - non-governmental organisation
      - ngo
  # --- Agricultural supply chains (cocoa, coffee, tea) -------------------
  # The aggregation node differs by commodity — society for cocoa, washing
  # station for coffee, factory or estate for tea — but the shape is the same:
  # a named site, operated by a legal entity, aggregating from many
  # smallholders. Stripping the form leaves the distinctive part ("Kuapa
  # Kokoo", not the shared "Farmers Cooperative Union Ltd").
  #
  # Stripping the form does NOT separate a site from its operator: "Nyeri Hill
  # Factory" and "Nyeri Hill Tea Factory Co Ltd" both reduce toward "Nyeri
  # Hill". Only a declared entity_class refutes that pair — see the `category`
  # comparator.
  UNION:
    description: Union of cooperatives or growers — a tier above the society, and never the same entity as its members.
    synonyms:
      - farmers co-operative union
      - farmers cooperative union
      - cooperative union
      - co-operative union
      - farmers union
      - farmers' union
      - growers union
      - union of cooperatives
  SACCO:
    description: Savings and credit cooperative (East Africa); frequently the payment vehicle for a growers' group rather than the grower itself.
    synonyms:
      - savings and credit cooperative
      - sacco
  BUYING_COMPANY:
    description: Licensed/produce buying company — the regulated intermediary that buys from farmers (Ghana cocoa).
    synonyms:
      - licensed buying company
      - produce buying company
      - buying company
      - lbc
  ESTATE:
    description: Estate or plantation — a large contiguous production holding, common in tea and coffee. A site, not its operating company.
    synonyms:
      - estate
      - plantation
      - tea estate
      - coffee estate
  FACTORY:
    description: Processing factory — the tea aggregation node (Kenya/KTDA smallholder factories). A site, not its operating company.
    synonyms:
      - tea factory
      - processing factory
      - factory
  WASHING_STATION:
    description: Coffee washing station / wet mill — where cherry is aggregated and a lot first acquires an identity.
    synonyms:
      - coffee washing station
      - washing station
      - wet mill
      - cws
  MILL:
    description: Dry mill or huller — later-stage coffee processing.
    synonyms:
      - dry mill
      - huller
      - mill
  ASSOCIATION:
    description: Growers' or producers' association, often unregistered.
    synonyms:
      - growers association
      - producers association
      - farmers association
      - association
  ENTERPRISE:
    description: Enterprise / ventures / trading — the most common informal African business suffix, and frequently a sole trader (see the personal-data boundary).
    synonyms:
      - enterprises
      - enterprise
      - ventures
      - trading company
  # Further legal forms, so a European counterparty's own records normalise
  # on the same footing as the African ones they are being joined to.
  BV:
    description: Besloten vennootschap (Netherlands) — common for EU cocoa and coffee importers.
    synonyms:
      - besloten vennootschap
      - b.v.
      - bv
  GMBH:
    description: Gesellschaft mit beschränkter Haftung (Germany/Austria).
    synonyms:
      - gmbh
  PTY:
    description: Proprietary limited (South Africa, Australia).
    synonyms:
      - proprietary limited
      - pty ltd
      - pty
  SA_CORP:
    description: Société anonyme / sociedade anónima — Francophone and Lusophone public company.
    synonyms:
      - societe anonyme
      - société anonyme
      - sociedade anonima
