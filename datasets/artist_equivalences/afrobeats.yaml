#
# Stage-name ↔ legal-name ↔ catalog-alias equivalences for African popular
# music (Afrobeats, amapiano, highlife, hiplife, bongo flava, Afrobeat).
# The artist counterpart of datasets/name_equivalences/: equivalence data buys
# recall, the frequency table buys precision, the gate keeps merges safe.
#
# Sources: MusicBrainz alias sets (CC0) plus curated public-record legal names.
# Note: the "Tyla" group is hand-corrected — a name-only MusicBrainz search
# returns a UK artist of the same name; this group is the South African artist
# (the wrong-Tyla lesson: names describe, identifiers distinguish).
tradition: African popular music — stage names, legal names, catalog alias forms
source: MusicBrainz (CC0) + curated public-record legal names
