# Hip-hop and R&B — stage ↔ legal ↔ catalog alias equivalences.
# Packs are organised by GENRE, like the rest of the catalog world: the point
# of arche is one engine for everyone's names, wherever they're from.
# Alias sets are taken verbatim from MusicBrainz (CC0), including misspelt
# catalog forms: those are the forms real royalty statements actually contain.
