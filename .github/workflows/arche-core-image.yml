name: arche-core image

# Builds packages/arche-core/Dockerfile and, on main and on release tags,
# publishes it to GitHub Container Registry as ghcr.io/<owner>/arche-core.
#
# The build is also a test: it installs every model extra on Linux and calls
# `arche._service.warm()`, which fails the build if GLiNER 2, GLiNER2-PII or
# docling's converter does not load. That is the only check in the
# repository that proves the extras compose -- the unit suite runs without
# them -- and it is what caught the CUDA-torch default and the
# torchvision/transformers import failure.
#
# Tags published:
#   push to main                      -> :edge, :sha-<short>
#   tag arche-core-v<version>         -> :<version>, :latest
#   pull request / schedule           -> built and smoke-tested, never pushed
#
# A second job builds the development image (.devcontainer/Dockerfile: every
# extra, the suite, the benchmarks, models warmed), runs the test suite and
# the recipe gate inside it, checks nothing git-ignored leaked into a layer,
# and publishes it as ghcr.io/<owner>/arche-dev:edge from main.
#
# The image is what `docker run ghcr.io/unpatterned-labs/arche-core` gives a
# user: `arche serve` on 8766 with every parser and both models inside, CPU
# only, offline at runtime, no authentication of its own.

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    tags: ["arche-core-v*"]
    paths:
      - "packages/arche-core/**"
      - ".devcontainer/**"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/arche-core-image.yml"
  pull_request:
    paths:
      - "packages/arche-core/Dockerfile"
      - "packages/arche-core/.dockerignore"
      - ".devcontainer/**"
      - ".dockerignore"
      - ".github/workflows/arche-core-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/arche-core

jobs:
  build:
    name: build, warm, /livez, publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=match,pattern=arche-core-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/arche-core-v') }}

      - name: Build (the warm-up gate runs inside the build)
        uses: docker/build-push-action@v6
        with:
          context: packages/arche-core
          load: true
          push: false
          tags: arche-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start and wait for the warm start
        run: |
          docker run -d --name arche -p 8766:8766 arche-core:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8766/livez | grep -q '"warm":true'; then
              echo "warm after ${i}x5s"; exit 0
            fi
            sleep 5
          done
          echo "the service never reported warm:true"; docker logs arche; exit 1

      - name: Capabilities
        run: curl -sf http://127.0.0.1:8766/capabilities | python3 -m json.tool

      - name: A document through the whole path
        run: |
          printf 'INVOICE\nSupplier: Bello Freight Nigeria Limited\nRC 1234567\nContact: Adesola Okonkwo, adesola@example.com, 08031234567\n' > a.txt
          printf 'PURCHASE ORDER\nVendor: Bello Freight Nigeria Ltd\nAttn: Adesola E. Okonkwo, adesola@example.com\n' > b.txt
          curl -sf -F files=@a.txt -F files=@b.txt -F entity=organisation -F jurisdiction=NG \
               http://127.0.0.1:8766/documents \
            | python3 -c "import json,sys; d=json.load(sys.stdin); (dec,)=d['decisions']; print(dec['identity'], dec['score']); assert dec['identity']=='same_entity', dec"

      - name: Stop
        if: always()
        run: docker rm -f arche || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: packages/arche-core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  dev:
    name: dev image (every extra, the suite, the gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/arche-dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          push: false
          tags: arche-dev:ci
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: The suite and the recipe gate run inside it
        run: |
          docker run --rm arche-dev:ci bash -c \
            "uv run --no-sync pytest packages/arche-core/tests packages/arche-mcp/tests -q -p no:cacheprovider \
             && uv run --no-sync python data/scripts/benchmark_gate.py --only recipe"

      - name: Nothing local leaked into the image
        run: |
          # The dev image is published. git-ignored material is not
          # docker-ignored by default, and a layer is forever.
          docker run --rm arche-dev:ci bash -c \
            "test ! -e data/confidential && test ! -e .venv && test ! -e data/_cache && echo clean"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish :edge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.DEV_IMAGE }}:edge
          cache-from: type=gha,scope=dev
