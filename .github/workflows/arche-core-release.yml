name: arche-core release

# Manual release of `arche-core` to PyPI (or TestPyPI for a rehearsal).
#
# Ordering note, and it is the whole reason this file is shaped the way it is:
# **the tag is created after the upload succeeds, never before.** This project
# has already been burned once the other way round. `0.3.0a2` was versioned,
# changelogged, and cited by SECURITY.md as the release carrying a fix, and it
# was never published, so the advisory told readers to upgrade to something
# that did not exist. A tag that only appears once PyPI has accepted the file
# means a tag can no longer promise a release that is not there.
#
# The run picks its own mode from two facts, so recovering from a half-finished
# release does not need a different workflow or a hand-made tag:
#
#   on index?   tagged?   what happens
#   ---------   -------   --------------------------------------------------
#   no          no        full release: test, build, publish, then tag
#   yes         no        TAG-ONLY: rebuild, prove this commit reproduces the
#                         published wheel, tag it. Nothing is uploaded.
#   yes         yes       refuse, there is nothing to do
#   no          yes       refuse, a tag with no release is the bad state
#
# The tag-only route exists because this workflow produced that state itself:
# an early version ran an index-availability check *after* the upload, so a
# slow index failed the job and the tag step never ran, leaving 0.4.0a1 on PyPI
# with no tag. A recovery path that verifies before it tags is better than a
# human running `git tag` and hoping they are on the right commit.
#
# The GitHub Release is created last, from the changelog, for the same ordering
# reason: it is a description of something that already happened, so it comes
# after the tag, which comes after the upload. Notes are cut out of
# `CHANGELOG.md` rather than written separately, because a second copy of the
# release notes is the copy nobody updates. Pre-release versions (`a`, `b`,
# `rc`) are marked as such, so an alpha never shows as "Latest" to somebody who
# wanted the stable line.
#
# Versions released before that job existed have no Release page. Backfill them
# with `arche-core-github-release.yml`, which describes an existing release and
# publishes nothing.
#
# The other guards exist because a release is the one workflow where a
# confusing failure is expensive:
#   - the version you type must match `_version.py`, so a stale branch cannot
#     publish something you did not intend
#   - the changelog must mention the version
#   - the full test matrix must pass on a real release, not a spot check
#   - the built wheel is opened, installed into a clean venv, and used before
#     anything leaves the runner
#
# Secrets required:
#   PYPI_TOKEN       for target: pypi
#   TEST_PYPI_TOKEN  for target: testpypi
#
# Worth considering later: PyPI Trusted Publishing (OIDC) removes the
# long-lived token entirely and is the current recommendation. It needs a
# publisher configured on the PyPI project side, so it is a change to make
# deliberately rather than as part of a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Must match packages/arche-core/src/arche/_version.py exactly (e.g. 0.4.0a1)."
        required: true
        type: string
      target:
        description: "Where to publish. Rehearse on testpypi first."
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release is safe to make
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so the duplicate-tag check can see them

      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12

      - name: Version input matches the package
        id: check
        run: |
          set -euo pipefail
          FILE="packages/arche-core/src/arche/_version.py"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('$FILE').read_text()).group(1))")
          IN="${{ inputs.version }}"
          echo "requested: $IN"
          echo "in $FILE : $PKG"
          if [ "$PKG" != "$IN" ]; then
            echo "::error::Version mismatch. You asked for '$IN' but $FILE says '$PKG'. Bump the file, or type the version it already has."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Decide what this run has to do
        id: mode
        run: |
          set -euo pipefail
          V="${{ steps.check.outputs.version }}"
          TAG="arche-core-v$V"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then TAGGED=yes; else TAGGED=no; fi

          if [ "${{ inputs.target }}" = "pypi" ]; then
            URL="https://pypi.org/pypi/arche-core/json"
          else
            URL="https://test.pypi.org/pypi/arche-core/json"
          fi
          # Fail closed. An earlier version treated any non-200 as "not
          # published", so a network blip would have chosen the release path
          # and tried to re-upload an existing version, which PyPI answers with
          # a 400 that reads like a credentials failure. Only two answers are
          # trustworthy here: 200 with a parsed body, or a definite 404.
          CODE=$(curl -sS -o /tmp/idx.json -w "%{http_code}" --retry 3 --retry-delay 2 "$URL" || echo "000")
          case "$CODE" in
            200)
              PUBLISHED=$(WANT="$V" python -c "
          import json, os
          rels = json.load(open('/tmp/idx.json')).get('releases', {})
          print('yes' if os.environ['WANT'] in rels else 'no')
          ")
              ;;
            404)
              PUBLISHED=no      # project has never been published on this index
              ;;
            *)
              echo "::error::Could not determine whether $V is on the index (HTTP $CODE). Refusing to guess."
              exit 1
              ;;
          esac

          echo "version=$V  published=$PUBLISHED  tagged=$TAGGED"

          # Four states, and only two of them are work. The published-but-not-
          # tagged case is a real one rather than a hypothetical: it is what an
          # earlier version of this workflow produced, by failing a job *after*
          # the upload had already succeeded. Recovering from it must not
          # require hand-crafting a tag, because a hand-crafted tag is exactly
          # the thing nobody can later verify.
          if [ "$PUBLISHED" = yes ] && [ "$TAGGED" = yes ]; then
            echo "::error::$V is already published and already tagged. Nothing to do. Bump _version.py for a new release."
            exit 1
          elif [ "$PUBLISHED" = yes ] && [ "$TAGGED" = no ]; then
            echo "mode=tag-only" >> "$GITHUB_OUTPUT"
            echo "::notice::$V is on the index but has no tag. This run will verify that this commit produced the published artifact, then tag it. Nothing will be uploaded."
          elif [ "$PUBLISHED" = no ] && [ "$TAGGED" = yes ]; then
            echo "::error::Tag $TAG exists but $V is not on the index. That is the state this workflow exists to prevent; investigate before proceeding."
            exit 1
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "::notice::$V is unpublished and untagged. Full release."
          fi

      - name: Changelog mentions this version
        run: |
          set -euo pipefail
          V="${{ steps.check.outputs.version }}"
          if ! grep -q "\[$V\]" packages/arche-core/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '[$V]' section. A release with no changelog entry is one nobody can read later."
            exit 1
          fi
          echo "Changelog has an entry for $V."

  test:
    name: pytest ${{ matrix.python-version }}
    needs: verify
    # A tag-only run publishes nothing, so re-running the suite cannot change
    # its outcome. What that run has to prove is that this commit produced the
    # artifact already on the index, and the build job proves it directly.
    if: needs.verify.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true        # a release should stop at the first failure
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - run: uv run --no-sync pytest packages/arche-core/tests -q --tb=short

  build:
    name: Build and inspect the artifacts
    needs: [verify, test]
    # `test` is skipped on a tag-only run, and a skipped need would otherwise
    # skip this job too.
    if: always() && !cancelled() && needs.verify.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          # `uv build` writes to the WORKSPACE root dist/, not to
          # packages/arche-core/dist/, because the root pyproject declares a
          # [tool.uv.workspace] with arche-core as a member. Clearing it first
          # means a cache restore or a repeated build can never leave an older
          # version sitting beside this one, which matters because the steps
          # below name files explicitly rather than globbing the directory.
          rm -rf dist
          uv build --package arche-core
          ls -l dist
          COUNT=$(ls dist | wc -l)
          [ "$COUNT" = "2" ] || { echo "::error::Expected exactly 2 artifacts, found $COUNT"; exit 1; }

      - name: Inspect what is actually in the wheel
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          WHEEL="dist/arche_core-${V}-py3-none-any.whl"
          test -f "$WHEEL" || { echo "::error::Expected $WHEEL, got: $(ls dist)"; exit 1; }
          python - <<PY
          import zipfile, sys
          w = zipfile.ZipFile("$WHEEL")
          names = w.namelist()
          size = sum(i.file_size for i in w.infolist())
          print(f"{len(names)} files, {size/1024/1024:.1f} MB uncompressed")

          # Data assets ship inside the wheel rather than being downloaded at
          # runtime. A wheel that builds but omits them installs cleanly and
          # then fails on the first resolve, which is the worst failure shape.
          required = [
              "arche/resolve/_data/name_frequencies.json.gz",
              "arche/resolve/_data/place_frequencies.json.gz",
              "arche/resolve/_data/organisation_frequencies.json.gz",
              "arche/resolve/_data/organisation_tokens.yaml",
              "arche/resolve/type_tokens.yaml",
              "arche/py.typed",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit("::error::Wheel is missing required data: " + ", ".join(missing))
          print("All required data assets present.")
          PY

      - name: Check the built metadata agrees with the tag
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          uv run --with twine --no-project twine check \
            "dist/arche_core-${V}-py3-none-any.whl" "dist/arche_core-${V}.tar.gz"
          python - <<'PY'
          import pathlib, re, os, sys, zipfile
          v = os.environ["WANT"]
          whl = next(pathlib.Path("dist").glob("*.whl"))
          meta = zipfile.ZipFile(whl).read(
              next(n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA"))
          ).decode()
          got = re.search(r"^Version: (.+)$", meta, re.M).group(1).strip()
          if got != v:
              sys.exit(f"::error::Wheel metadata says {got}, expected {v}")
          print(f"Wheel metadata version is {got}.")
          PY
        env:
          WANT: ${{ needs.verify.outputs.version }}

      - name: Smoke-test the wheel from disk
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          # Install the exact file that is about to be published, into a clean
          # interpreter, and use it. This replaces an earlier post-publish
          # check against the index, which was wrong twice over: it ran after
          # the point of no return, so it could not prevent anything, and it
          # gated the tag job on index propagation, so a slow index produced a
          # published-but-untagged release. That is the failure this workflow
          # exists to make impossible.
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python \
            "dist/arche_core-${V}-py3-none-any.whl"

          /tmp/smoke/bin/python - <<PY
          import sys
          import arche
          from arche.resolve import ENTITY_PACKS, crosswalk
          from arche.resolve._tokenfreq import TokenFrequencyTable

          assert arche.__version__ == "$V", f"installed {arche.__version__}, expected $V"

          # Being present in the zip is not the same as loading. The data files
          # are the part most likely to be packaged wrong, so open one.
          tf = TokenFrequencyTable.default("organisation")
          assert tf.population_scale, "organisation table is not population-scale"

          # And run the engine end to end from a clean install, so a broken
          # import chain or a missing vocabulary surfaces here rather than in
          # somebody's first five minutes with the package.
          res = crosswalk(
              [{"id": "a", "name": "Sefwi Wiawso Cooperative Society"}],
              [{"id": "b", "name": "Sefwi Wiawso Co-operative Society Ltd"}],
              entity="organisation", id_field="id",
          )
          assert res["matches"], "no candidate pair produced"
          print(f"arche {arche.__version__} installs, loads its data, and resolves.")
          print(f"  packs: {sorted(set(ENTITY_PACKS))}")
          print(f"  verdict: {res['matches'][0]['decision']}")
          PY

      - name: This commit must be what was published
        if: needs.verify.outputs.mode == 'tag-only'
        run: |
          set -euo pipefail
          V="${{ needs.verify.outputs.version }}"
          # Tagging an already-published version is only safe if this commit is
          # the one that produced it. Otherwise the tag points at code nobody
          # ever shipped, which is worse than no tag at all.
          #
          # Compare member CONTENTS, not the wheel's own hash: a zip embeds
          # timestamps, so two builds of identical source almost never hash the
          # same. Normalise newlines too, because a wheel built on Windows
          # carries CRLF where a Linux build carries LF, and that alone made a
          # local check report 63 false differences out of 65.
          python - <<PY
          import hashlib, io, json, sys, urllib.request, zipfile

          V = "$V"
          with urllib.request.urlopen("https://pypi.org/pypi/arche-core/json", timeout=60) as r:
              meta = json.load(r)
          url = next(f["url"] for f in meta["releases"][V] if f["filename"].endswith(".whl"))
          with urllib.request.urlopen(url, timeout=120) as r:
              pub = zipfile.ZipFile(io.BytesIO(r.read()))
          loc = zipfile.ZipFile(f"dist/arche_core-{V}-py3-none-any.whl")

          def norm(b): return b.replace(b"\r\n", b"\n")
          # RECORD hashes every other member, so it differs whenever anything
          # does and carries no information of its own.
          skip = ("RECORD", "WHEEL")

          pn = {i.filename for i in pub.infolist() if not i.is_dir()}
          ln = {i.filename for i in loc.infolist() if not i.is_dir()}
          problems = []
          for name in sorted(pn - ln):
              problems.append(f"missing locally: {name}")
          for name in sorted(ln - pn):
              problems.append(f"extra locally:   {name}")
          for name in sorted(pn & ln):
              if name.endswith(skip):
                  continue
              if norm(pub.read(name)) != norm(loc.read(name)):
                  problems.append(f"content differs: {name}")

          if problems:
              print(f"::error::This commit does not reproduce the published {V}.")
              for p in problems[:20]:
                  print(f"  {p}")
              if len(problems) > 20:
                  print(f"  ... and {len(problems) - 20} more")
              sys.exit(1)
          print(f"This commit reproduces the published {V} exactly. Safe to tag.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/arche_core-${{ needs.verify.outputs.version }}-py3-none-any.whl
            dist/arche_core-${{ needs.verify.outputs.version }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.target }}
    needs: [verify, test, build]
    # Skipped entirely on a tag-only run: the artifact is already on the index
    # and re-uploading it is not possible anyway.
    if: needs.verify.outputs.mode == 'release' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this environment in repo settings with required reviewers if
    # you want a human approval step between "build passed" and "it is public".
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ inputs.target == 'pypi' && secrets.PYPI_TOKEN || secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "::error::No token. Set PYPI_TOKEN (or TEST_PYPI_TOKEN) in repository secrets."
            exit 1
          fi
          V="${{ needs.verify.outputs.version }}"
          WHL="dist/arche_core-${V}-py3-none-any.whl"
          SDIST="dist/arche_core-${V}.tar.gz"
          test -f "$WHL" && test -f "$SDIST" || { echo "::error::Missing $WHL or $SDIST"; exit 1; }
          # Named explicitly, never a glob over dist/. A glob uploads whatever
          # else is sitting in the directory, and this project has a version
          # (0.3.0a2) that was deliberately never released and must not reach
          # the index. Naming the files makes that impossible rather than
          # unlikely.
          if [ "${{ inputs.target }}" = "pypi" ]; then
            uv publish "$WHL" "$SDIST"
          else
            uv publish --publish-url https://test.pypi.org/legacy/ "$WHL" "$SDIST"
          fi

      - name: Record where it landed
        run: |
          V="${{ needs.verify.outputs.version }}"
          if [ "${{ inputs.target }}" = "pypi" ]; then
            URL="https://pypi.org/project/arche-core/$V/"
          else
            URL="https://test.pypi.org/project/arche-core/$V/"
          fi
          echo "Published $V to ${{ inputs.target }}: $URL"
          echo "- Published \`$V\` to ${{ inputs.target }}: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "  Indexes take a few minutes to serve a new file. That is normal and is not checked here, deliberately: see the smoke test in the build job, which verifies the same artifact *before* it is published." >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the released commit
    needs: [verify, build, publish]
    # Only tag what actually reached PyPI, so a TestPyPI rehearsal leaves no
    # tag behind. Two routes get here: a publish that just succeeded, or a
    # tag-only run whose build proved this commit reproduces what is already
    # on the index. `publish` is skipped on the second route, and a skipped
    # need would otherwise skip this job too.
    if: >-
      !cancelled() && inputs.target == 'pypi'
      && needs.build.result == 'success'
      && (needs.publish.result == 'success' || needs.verify.outputs.mode == 'tag-only')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push the tag
        run: |
          set -euo pipefail
          TAG="arche-core-v${{ needs.verify.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ needs.verify.outputs.mode }}" = "tag-only" ]; then
            MSG="arche-core ${{ needs.verify.outputs.version }} (on PyPI; tag added afterwards, commit verified to reproduce the published wheel)"
          else
            MSG="arche-core ${{ needs.verify.outputs.version }} (published to PyPI by this run)"
          fi
          git tag -a "$TAG" -m "$MSG"
          git push origin "$TAG"
          echo "Tagged $TAG."

      - name: Summary
        run: |
          {
            echo "### arche-core ${{ needs.verify.outputs.version }} released"
            echo ""
            echo "- Published to PyPI and confirmed installable"
            echo "- Tagged \`arche-core-v${{ needs.verify.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github_release:
    name: Publish the GitHub Release
    needs: [verify, build, publish, tag]
    # Last, and deliberately so. The release is a description of something that
    # already happened: the tag has to exist before it can point at one, and the
    # tag only exists once PyPI has accepted the file. Running this earlier would
    # reintroduce, in a different shape, the failure the whole file is built
    # around — an announcement of a release that is not there.
    #
    # `publish` is skipped on a tag-only run, and a skipped need would otherwise
    # skip this job too.
    if: >-
      !cancelled() && inputs.target == 'pypi'
      && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the tag the previous job just pushed

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Cut the notes out of the changelog
        id: notes
        env:
          WANT: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The changelog is the release notes. Writing them twice means writing
          # them differently, and the second copy is the one nobody updates.
          python - <<'PY'
          import os, pathlib, re, sys

          v = os.environ["WANT"]
          text = pathlib.Path("packages/arche-core/CHANGELOG.md").read_text(encoding="utf-8")

          # From this version's heading to the next version heading, whatever it
          # is. Anchored on `## [` so a `### ` subsection can never end a section.
          m = re.search(
              rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          if not m:
              sys.exit(f"::error::CHANGELOG.md has no '## [{v}]' section to cut notes from.")
          body = m.group(1).strip()
          if len(body) < 40:
              sys.exit(
                  f"::error::The '[{v}]' changelog section is {len(body)} characters. "
                  "A release announced with empty notes is one nobody can read later."
              )
          pathlib.Path("NOTES.md").write_text(body + "\n", encoding="utf-8")
          print(f"{len(body)} characters of notes, {body.count(chr(10)) + 1} lines.")
          PY

      - name: Is this a prerelease
        id: kind
        env:
          WANT: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # PEP 440 pre-release segments. Every arche-core release so far is one
          # of these, and marking them correctly is what stops GitHub showing an
          # alpha as "Latest" to somebody who just wants the stable line.
          if printf '%s' "$WANT" | grep -Eq '(a|b|rc)[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
          PRE: ${{ steps.kind.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="arche-core-v$V"

          # Re-running a recovery is normal in this workflow, so an existing
          # release is reported rather than treated as a failure. It is not
          # overwritten either: notes somebody may have edited by hand are not
          # this job's to replace.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::A GitHub Release already exists for $TAG. Left untouched."
            echo "- GitHub Release for \`$TAG\` already existed; not modified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ARGS=(--title "arche-core v$V" --notes-file NOTES.md --verify-tag)
          [ "$PRE" = "true" ] && ARGS+=(--prerelease)

          # The same two files that went to PyPI, attached to the release, so
          # the artifact is retrievable even if an index entry is ever yanked.
          gh release create "$TAG" "${ARGS[@]}" \
            "dist/arche_core-${V}-py3-none-any.whl" \
            "dist/arche_core-${V}.tar.gz"

          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "Created $URL"
          {
            echo "- GitHub Release: $URL"
            echo "- Marked prerelease: \`$PRE\`"
            echo "- Notes taken from the \`[$V]\` section of CHANGELOG.md"
          } >> "$GITHUB_STEP_SUMMARY"
