[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arche-synthetic"
version = "0.0.1"
description = "Known entity worlds, imperfect observations, and exact ground truth — with every disagreement labelled by why it happened, not just that it exists."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Dennis Irorere", email = "connect@unpatterned.org"}]
keywords = [
    "entity-resolution", "record-linkage", "synthetic-data", "benchmark",
    "ground-truth", "data-matching", "deduplication", "evaluation",
    "temporal", "provenance", "Africa", "Nigeria",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Testing",
]

# Deliberately two. A benchmark that is expensive to install is a benchmark
# nobody runs, and the whole argument for this package is that a Splink or
# Zingg user can consume it without adopting anything of ours -- which stops
# being true the moment `pip install arche-synthetic` drags in a matcher.
dependencies = [
    "pyarrow>=14",   # the interchange format; the contract is the files
    "pyyaml>=6.0",   # the manifest
]

[project.optional-dependencies]
# The comparison harness: the baseline arms and the report.
bench = ["jellyfish>=1.0", "pandas>=2.0"]
# The Splink arm.
splink = ["arche-synthetic[bench]", "splink>=4.0", "duckdb>=1.0"]
# The arche arms, including the ledger. Optional on purpose: this package must
# never require the engine it exists to measure.
arche = ["arche-synthetic[bench]", "arche-core>=0.8.0", "duckdb>=1.0"]
all = ["arche-synthetic[bench,splink,arche]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://unpatterned.org"
Repository = "https://github.com/unpatterned-labs/arche-synthetic"

[project.scripts]
arche-synthetic-build = "arche_synthetic.__main__:main"

[tool.hatch.build.targets.wheel]
# The vendored lexicon lives inside the package directory, so it is included
# by default. A `force-include` entry for it is not merely redundant -- it
# makes hatchling add the same path twice and the build fails outright.
packages = ["arche_synthetic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
