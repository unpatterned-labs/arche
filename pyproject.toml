[project]
name = "arche-workspace"
version = "0.0.0"
requires-python = ">=3.11"
description = "Arche monorepo — the open-source identity resolution SDK by unpatterned.org"
dependencies = [
    "arche-core[all]",
    "ipykernel>=7.2.0",
]

# ---------------------------------------------------------------------------
# uv workspace configuration
# ---------------------------------------------------------------------------

# The repository root is an orchestration/development workspace, not a Python
# distribution itself. The actual distributable package lives in
# packages/arche-core.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/arche-core",
]

# Workspace members and package-specific indexes.
#
# These entries MUST remain under [tool.uv.sources].
# Moving torch/torchvision beneath [tool.uv] causes uv to interpret them as
# invalid uv settings rather than dependency sources.
[tool.uv.sources]
arche-core = { workspace = true }

# Arche runs on CPU by design.
#
# On Linux, explicitly use PyTorch's CPU index. This avoids pulling the
# considerably larger CUDA-enabled PyTorch distribution through transitive
# dependencies such as GLiNER/docling.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


# ---------------------------------------------------------------------------
# Development dependency groups
# ---------------------------------------------------------------------------

[dependency-groups]

dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",

    # The ledger, studio and review pack read and write Parquet.
    # pyarrow is an Arche extra rather than a base dependency, so keep it
    # available explicitly in the development environment.
    "pyarrow>=14",

    # `arche serve` is behind the `service` extra. It is deliberately not
    # included in arche-core[all] so the normal library wheel remains a
    # library rather than carrying the service stack.
    "arche-core[service]",

    "httpx>=0.27",

    # Studio hash-key tests and MCP tests import arche.mcp.server.
    "arche-core[mcp]",
]

# Everything required for the full development image and document/OCR work.
#
# Opt-in with:
#
#     uv sync --group full
#
# These dependencies are intentionally excluded from the light/default
# development environment because document/OCR dependencies can be large.
full = [
    "arche-core[all,doc,doc-ocr,service,ledger,detect2,mcp]",

    # These are declared directly so the [tool.uv.sources] CPU index mapping
    # above applies on Linux. Otherwise torch may only be reached transitively.
    "torch",
    "torchvision",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]

# Notebook builders contain prose in long triple-quoted Markdown strings.
# Applying E501 to those files would introduce artificial line breaks into
# prose that is ultimately rendered as notebook Markdown.
"examples/notebooks/build_*.py" = ["E501"]

# Tests intentionally use A/B terminology for record pairs and descriptive
# test names that do not always conform to pep8-naming.
"packages/arche-core/tests/*" = [
    "N802",
    "N803",
    "N806",
    "N811",
    "N812",
]


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = [
    "packages/arche-core/tests",
]

asyncio_mode = "auto"

# Silence known dependency deprecations and Arche's internal compatibility
# warnings so test output remains focused on actionable failures.
filterwarnings = [
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    "ignore:The `resume_download` argument is deprecated:UserWarning",
]