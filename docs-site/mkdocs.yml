site_name: arche
# "Composes with Splink" was the old tail of this line. It described one
# deprecated function and nothing else in the package: pairwise, crosswalk and
# reconcile import zero splink. See tutorials/arche_vs_alternatives.md.
site_description: Know what's real. The open engine for messy, multilingual data - find the entities, resolve who they actually are, protect them under the law that applies, and sign every decision. The representation layer record linkage needs - equivalence packs, frequency tables, identifier grammars and statute packs, shipped as inspectable data. Composes with Presidio and GLiNER as detector backends.
site_url: https://unpatterned-labs.github.io/arche/
repo_url: https://github.com/unpatterned-labs/arche
repo_name: unpatterned-labs/arche

theme:
  name: material
  # Both schemes, with a toggle. The site previously shipped `default` only,
  # so a reader with a dark system theme got a full-brightness page and no way
  # to change it. Palette values live in stylesheets/extra.css; see DESIGN.md.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    # Instrument Serif carries the headings because this is a product about
    # records, names and statutes, and a serif says "record" in a way no
    # grotesque does. Instrument Sans is its native companion. See DESIGN.md.
    text: Instrument Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    # Previous / next links in the page footer, driven by nav order. A
    # reader landing mid-way through a sequence otherwise has no way to
    # tell what precedes a page or what continues it.
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Working drafts. `.gitignore` keeps these out of git; it does NOT keep them
# out of the built site — mkdocs renders everything under docs/, so without
# this they publish to /concepts/drafts/ and are reachable by URL from anyone
# who builds and deploys a working copy. Their unresolved cross-links also
# abort `--strict`. Excluded here so the intent lives in config rather than
# depending on a second file to mean something it does not mean.
exclude_docs: |
  concepts/drafts/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  # Without `custom_fences`, a ```mermaid block is just a fenced code block:
  # superfences hands it to the highlighter and the reader gets the diagram's
  # source, with line numbers, instead of a diagram. Material loads mermaid.js
  # itself once the fence is registered.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Quick start: getting-started/quickstart.md
  # Concepts come before the how-to guides: the published site previously had
  # 28 pages that all explained how to call a function and not one that
  # explained what arche is. These pages lived in a gitignored directory.
  - Concepts:
    # Three pages describe the flow, and the order is the reading path:
    # how-it-works is the newcomer's walkthrough, lifecycle is the "can it do
    # X today" inventory, architecture is the internal layering. Each page
    # states that split in its opening lines.
    # The three orientation pages, in reading order: what this is and what is
    # measured, then why the hard part is hard, then what it changes for you.
    - The whole picture: concepts/the-whole-picture.md
    - Sameness and similarity: concepts/sameness-and-similarity.md
    - arche in practice: concepts/arche-in-practice.md
    - How arche works: concepts/how-it-works.md
    # Second, and deliberately: the newcomer's walkthrough explains the
    # mechanism, this shows the problem it is a mechanism for. Every
    # verdict on it is generated by running the pair, not hand-written.
    - What matching looks like: concepts/what-matching-looks-like.md
    - The identity lifecycle: concepts/lifecycle.md
    - Architecture: concepts/architecture.md
    - A representation engine, not an inference engine: concepts/representation-engine.md
    - The five ER activities: concepts/er-activities.md
    # One section for "what kind of thing am I resolving". Each page sorts a
    # record's fields into carries-identity / conditional / describes-only, and
    # the conditional group means something different for every entity type.
    - Entities:
      - Overview: concepts/entities.md
      - Person identity: concepts/person-identity.md
      - Place identity: concepts/place-identity.md
      - Product identity: concepts/product-identity.md
      - The place benchmark: concepts/place-benchmark.md
    - The document lane: concepts/document-lane.md
    - Attest, the signature on the decision: concepts/attest.md
  - Guides:
    - Match African names: how-to/match-african-names.md
    - Extract from invoice: how-to/extract-from-invoice.md
    - Declare your schema (your fields, our roles): how-to/declare-your-schema.md
    - Bring your own LLM (arche grades it): how-to/bring-your-own-llm.md
    # Both were tracked, built, and linked from other pages, but appeared in
    # no nav entry — so the two flagship v0.3.0a1 features had documentation
    # nobody could navigate to.
    - Extract places with spatial roles: how-to/extract-places-with-roles.md
    - Read the crosswalk output: how-to/read-crosswalk-output.md
    - Verify a merge against an external source: how-to/verify-with-external-sources.md
    # Sits directly after it: that page corroborates a decision against outside
    # data, this one checks the artifact itself. Readers arrive looking for
    # "verify" and get sent to whichever of the two they actually meant.
    - Re-verify a decision (and read someone else's): how-to/re-verify-a-decision.md
    - Why arche and when to use it: tutorials/arche_vs_alternatives.md
    - Place resolution at scale (NG + UK): tutorials/place_resolution_at_scale.md
    - Person resolution at scale (scored): tutorials/person_resolution_at_scale.md
    - Artist resolution (Afrobeats x West): tutorials/artist_resolution.md
    - Zero to hero with documents: tutorials/zero-to-hero-documents.md
    - Matching products: tutorials/products.md
  - Cookbooks:
    - Nigerian fintech KYC: cookbooks/fintech-kyc.md
    - South African health export: cookbooks/health-export.md
    - Journalist PII scan: cookbooks/journalist-scan.md
    - Civil-society audit: cookbooks/civil-society-audit.md
    - Streamlit stakeholder demo: cookbooks/streamlit-demo.md
  - Workflows:
    - Sign, share, extract: tutorials/sign_share_extract.md
    # "Citizen DSAR" expanded: a reader who does not already work in data
    # protection cannot tell what the page is for from the acronym alone.
    - Data Subject Access Requests (DSAR): tutorials/citizen_dsar.md
    - Entity resolution: tutorials/entity_resolution.md
  - API:
    - Overview: api/index.md
    # Points at pipeline.md, not resolve.md. resolve.md documented an
    # `audit_log=` parameter that does not exist and three Result methods
    # that were never implemented; pipeline.md is the verified reference and
    # had been orphaned from the nav. resolve.md is a consolidation candidate.
    - Pipeline: api/pipeline.md
    - detect(): api/detect.md
    - crosswalk(), pairwise(), sign_edges(): api/crosswalk.md
    - addr — addresses, spatial roles, grading: api/addr.md
  - Examples:
    - Pipeline (NDPA): https://github.com/unpatterned-labs/arche/blob/main/examples/01_pipeline_ndpa.py
    - Sign-share-extract: https://github.com/unpatterned-labs/arche/blob/main/examples/02_sign_share_extract.py
    - DSAR workflow: https://github.com/unpatterned-labs/arche/blob/main/examples/03_dsar_workflow.py
    - SD-JWT-VC: https://github.com/unpatterned-labs/arche/blob/main/examples/04_sd_jwt_credential.py
    - Audit log: https://github.com/unpatterned-labs/arche/blob/main/examples/05_audit_log.py
  - Datasets:
    - Pan-African PII Taxonomy: https://github.com/unpatterned-labs/arche/tree/main/datasets/pan-african-pii-taxonomy
  - Blog:
    - blog/index.md
    # Newest first, matching blog/index.md's own ordering. Three posts were
    # written but never added here, so they existed on the site and could not
    # be navigated to; `mkdocs build` reports those under "not included in the
    # nav configuration" rather than as an error, which is easy to scroll past.
    - The number we could not reproduce: blog/the-number-we-could-not-reproduce.md
    - You do not need an account to buy bread: blog/you-do-not-need-an-account-to-buy-bread.md
    - Who acted?: blog/who-acted.md
    - The join nobody sells: blog/the-join-nobody-sells.md
    - Who made this document?: blog/who-made-this-document.md
    - Three PDFs and a question: blog/three-pdfs-and-a-question.md
    - A place is not a point: blog/a-place-is-not-a-point.md
    - Similar is not the same: blog/similar-is-not-the-same.md
    - The part intelligence doesn't make cheaper: blog/the-part-intelligence-doesnt-make-cheaper.md
    - The same clinic, three spellings: blog/reconciling-nigerias-health-facilities.md
    - Introducing arche: blog/introducing-arche.md

