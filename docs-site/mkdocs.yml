site_name: arche
site_description: Are these the same thing? arche decides whether messy records of people, organisations, places and products describe one real-world thing, shows the evidence, and keeps a receipt you can replay.
site_url: https://unpatterned-labs.github.io/arche/
repo_url: https://github.com/unpatterned-labs/arche
repo_name: unpatterned-labs/arche
copyright: unpatterned.org. Apache-2.0.

# The look is DESIGN.md at the repository root: paper, ink, one accent used
# only as a mark, Source Serif 4 and JetBrains Mono, no dark mode. Material
# supplies the structure (sidebar tree, page outline, prev/next, search) and
# docs/stylesheets/extra.css restyles it; overrides/ holds the two templates
# the theme cannot express in CSS (the fonts, and the full-width home page).
theme:
  name: material
  custom_dir: overrides
  # One palette, no toggle: a mapping here rather than a list is what tells
  # Material not to render the scheme switch or load its palette script.
  palette:
    scheme: default
    primary: custom
    accent: custom
  # Fonts are loaded in overrides/main.html so the fallback stack and the
  # optical-size axis are ours, not Material's Google Fonts line.
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

# Everything under `docs/` is built. The pages that were not rewritten for the
# 1.0 site moved to the repository's gitignored `docs/harvested/` rather than
# staying here excluded: a page nobody can read on the site but everybody gets
# in a clone is the worst of both, and several of them described modules
# removed in 0.8.0. Their URLs still answer, through `redirect_maps` below.
#
# `concepts/` is the one exclusion left. It is gitignored working material
# (roadmaps, plans, positioning) that exists only in a local checkout, and
# naming it here keeps a local build and `test_docs_examples.py` away from it.
#
# Keep this a `|` literal block: `test_docs_examples.py` parses it, and every
# published page's Python examples run in that test.
exclude_docs: |
  concepts/
