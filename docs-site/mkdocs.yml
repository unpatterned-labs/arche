site_name: arche
site_description: An open-source engine for deciding when messy records of people, places, organisations, and products refer to the same real-world entity, with evidence, not just similarity scores or identifiers.
site_url: https://unpatterned-labs.github.io/arche/
repo_url: https://github.com/unpatterned-labs/arche
repo_name: unpatterned-labs/arche

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Instrument Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Alpha documentation is intentionally small. The excluded pages remain in the
# repository as working material, but do not form part of the public product
# promise until their examples and claims have been revalidated.
# Gitignore syntax, so a `!` line publishes one page back out of an excluded
# directory. The bar for adding a `!` line is that every Python example on the
# page executes: `test_docs_examples.py` parses this list and runs the examples
# on whatever is published, so publishing a page puts it under test in the same
# commit.
exclude_docs: |
  about/
  api/
  blog/
  concepts/
  cookbooks/
  how-to/
  tutorials/
  !api/addr.md
  !how-to/match-african-names.md
  !how-to/read-crosswalk-output.md
  !tutorials/how-it-works.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  # The custom fence is what makes ```mermaid a diagram rather than a code
  # block. Without it the diagrams ship as source, which is what was happening
  # to the one in about/the-whole-picture.md.
  #
  # Note what this costs: Material loads mermaid from `unpkg.com/mermaid@11` at
  # runtime rather than bundling it, so a page with a diagram makes a
  # third-party request and shows nothing useful offline. That is the site's
  # second external dependency after the fonts. To remove it, vendor
  # mermaid.min.js under docs/javascripts/ and add it to `extra_javascript`.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Get started:
    - Installation: getting-started/installation.md
    - Resolve two lists: getting-started/quickstart.md
  - Guides:
    - Prepare your data: guides/prepare-data.md
    - Interpret a decision: guides/interpret-decisions.md
    - Review and evaluate a crosswalk: guides/review-and-evaluate.md
    - Places and products in action: guides/places-and-products.md
    - Prepare health and care locations: guides/uk-health-and-care.md
    - Reconcile health facilities: guides/facility-reconciliation.md
    - Compare records, review a queue: guides/review-log.md
    - Let an agent call arche: guides/mcp-server.md
    - Run the MCP server: guides/run-the-mcp-server.md
    - Reconcile schools: guides/school-reconciliation.md
    - Resolve people across documents: guides/documents-to-decision.md
    - Accuracy and scope: guides/accuracy-and-scope.md
  - Reference:
    - Architecture: reference/architecture.md
    - How arche works: reference/how-arche-works.md
    - A single call, walked through: tutorials/how-it-works.md
    - Decision contract: reference/decision-contract.md
    - Record resolution API: reference/record-resolution.md
    - Read a crosswalk result: how-to/read-crosswalk-output.md
    - Addresses: api/addr.md
    - Match African names: how-to/match-african-names.md
    - Benchmarks: reference/benchmarks.md
  - Contribute: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unpatterned-labs/arche
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/arche-core/
