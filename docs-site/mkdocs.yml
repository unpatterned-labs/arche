site_name: arche
site_description: Are these the same thing? arche decides whether messy records of people, organisations, places and products describe one real-world thing, shows the evidence, and keeps a receipt you can replay.
site_url: https://unpatterned-labs.github.io/arche/
repo_url: https://github.com/unpatterned-labs/arche
repo_name: unpatterned-labs/arche

# The look is DESIGN.md at the repository root: paper, ink, one accent used
# only as a mark, Source Serif 4 and JetBrains Mono, no dark mode. Material
# supplies the structure (sidebar tree, page outline, prev/next, search) and
# docs/stylesheets/extra.css restyles it; overrides/ holds the two templates
# the theme cannot express in CSS (the fonts, and the full-width home page).
theme:
  name: material
  custom_dir: overrides
  # One palette, no toggle: a mapping here rather than a list is what tells
  # Material not to render the scheme switch or load its palette script.
  palette:
    scheme: default
    primary: custom
    accent: custom
  # Fonts are loaded in overrides/main.html so the fallback stack and the
  # optical-size axis are ours, not Material's Google Fonts line.
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

# Documentation is the published tree below. The excluded directories are
# working material that stays in the repository but is not built: their
# examples and claims have not been revalidated against the current package.
# Gitignore syntax, so a `!` line publishes one page back out of an excluded
# directory. The bar for a `!` line is that every Python example on the page
# executes: `test_docs_examples.py` parses this block (keep it a `|` literal)
# and runs the examples on whatever is published.
exclude_docs: |
  about/
  api/
  concepts/
  cookbooks/
  getting-started/
  how-to/
  tutorials/
  guides/accuracy-and-scope.md
  guides/association-analysis.md
  guides/documents-to-decision.md
  guides/facility-reconciliation.md
  guides/interpret-decisions.md
  guides/places-and-products.md
  guides/prepare-data.md
  guides/review-and-evaluate.md
  guides/review-log.md
  guides/run-the-mcp-server.md
  guides/school-reconciliation.md
  guides/uk-health-and-care.md
  reference/architecture.md
  reference/attestation.md
  reference/decision-contract.md
  reference/distinctiveness.md
  reference/how-arche-works.md
  reference/optional-dependencies.md
  reference/record-resolution.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Pages move as the tree is reorganised; a URL that was published keeps
  # answering. Old path -> new path, both relative to docs/.
  - redirects:
      redirect_maps:
        getting-started/installation.md: get-started/install.md
        getting-started/quickstart.md: get-started/five-minutes.md
        guides/association-analysis.md: guides/keep-and-replay.md
        guides/documents-to-decision.md: guides/resolve-documents.md
        guides/interpret-decisions.md: guides/compare-two-records.md
        guides/prepare-data.md: guides/resolve-a-batch.md
        guides/review-and-evaluate.md: guides/review-a-queue.md
        guides/review-log.md: guides/review-a-queue.md
        guides/run-the-mcp-server.md: guides/mcp-server.md
        guides/school-reconciliation.md: guides/resolve-a-batch.md
        guides/facility-reconciliation.md: guides/resolve-a-batch.md
        guides/places-and-products.md: guides/compare-two-records.md
        guides/accuracy-and-scope.md: reference/benchmarks.md
        guides/uk-health-and-care.md: guides/resolve-a-batch.md
        how-to/read-crosswalk-output.md: guides/resolve-a-batch.md
        how-to/match-african-names.md: guides/compare-two-records.md
        reference/decision-contract.md: how-it-works/the-decision.md
        reference/how-arche-works.md: how-it-works/evidence.md
        reference/distinctiveness.md: how-it-works/evidence.md
        reference/architecture.md: how-it-works/evidence.md
        reference/record-resolution.md: how-it-works/backends.md
        reference/attestation.md: how-it-works/attestation.md
        reference/optional-dependencies.md: reference/extras.md
        api/addr.md: how-it-works/places.md
        how-to/extract-places-with-roles.md: how-it-works/places.md
        how-to/attest.md: how-it-works/attestation.md
        tutorials/how-it-works.md: how-it-works/evidence.md
        blog/index.md: writing/index.md
        blog/what-a-name-list-is-worth.md: writing/what-a-name-list-is-worth.md
        blog/the-number-we-could-not-reproduce.md: writing/the-number-we-could-not-reproduce.md
        blog/similar-is-not-the-same.md: writing/similar-is-not-the-same.md
        blog/the-join-nobody-sells.md: writing/the-join-nobody-sells.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  # The custom fence makes ```mermaid a diagram rather than a code block.
  # Material loads mermaid from unpkg at runtime, so a page with a diagram
  # makes a third-party request; no page in the published tree has one.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

